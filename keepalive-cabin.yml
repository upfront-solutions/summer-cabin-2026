# .github/workflows/keepalive-cabin.yml
#
# Keeps the Supabase free-tier project "summer-cabin-2026" from pausing.
# Supabase pauses a free project after roughly a week with no database
# activity. This runs one real query per day, well above the threshold.
#
# ONE-TIME SETUP
#   Add the repository secret before the first run:
#     Settings > Secrets and variables > Actions > New repository secret
#       Name:  CABIN_ANON_KEY
#       Value: the publishable key (sb_publishable_...) or legacy anon key
#              from Supabase > Settings > API Keys
#
#   Then: Actions tab > "Supabase keepalive" > Run workflow, to test it now.

name: Supabase keepalive

on:
  schedule:
    # 15:17 UTC daily (8:17am Pacific). Deliberately off the hour, because
    # GitHub's scheduler is congested at :00 and delays those runs.
    - cron: "17 15 * * *"
  workflow_dispatch:        # run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping summer-cabin-2026
        env:
          SUPABASE_URL: https://uyokuhdqfukkknqoamfx.supabase.co
          ANON_KEY: ${{ secrets.CABIN_ANON_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${ANON_KEY:-}" ]; then
            echo "::error::CABIN_ANON_KEY secret is not set on this repository."
            exit 1
          fi
          # Only the apikey header. Authorization: Bearer expects a JWT, and the
          # newer sb_publishable_ keys are not JWTs, so sending it can 401.
          code=$(curl -sS -o /tmp/body.txt -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/scores?select=*&limit=1" \
            -H "apikey: $ANON_KEY")
          echo "HTTP $code"
          echo "Response: $(cat /tmp/body.txt)"
          if [ "$code" != "200" ]; then
            echo "::error::Keepalive failed. 401 = wrong or truncated key. 404 = the 'scores' table was renamed or removed."
            exit 1
          fi
          echo "summer-cabin-2026 pinged successfully."
